    <title>লিপি — Bangla & English Typing Academy</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lipi-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
